<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d" id="themeColor">
<title>AI World — Open Studio</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f4f4f1;--panel:rgba(255,255,255,.86);--panel-solid:#fff;--line:#d7d7d2;
  --text:#141416;--muted:#666b74;--surface:#f0f0ed;--input:#fff;--accent:#f07818;
  --ok:#2f9b62;--bad:#d64d4d;--bubble:#fff;--bubbleText:#16171a;--shadow:rgba(20,20,20,.12)
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#090a0d;--panel:rgba(15,16,20,.86);--panel-solid:#111216;--line:#2b2f37;
    --text:#f2f1ef;--muted:#9aa0aa;--surface:#17191e;--input:#0d0f13;--accent:#f07818;
    --ok:#6bd492;--bad:#ef7777;--bubble:#f5f4f1;--bubbleText:#16171a;--shadow:rgba(0,0,0,.3)
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif}
button,input,select{font:inherit}.app{position:fixed;inset:0}#stage{position:absolute;inset:0}
.top{position:absolute;z-index:40;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));height:54px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-shadow:0 12px 40px var(--shadow)}
.brand{display:flex;align-items:center;gap:9px;font-weight:900}.logo{width:32px;height:32px;border-radius:10px;background:var(--accent);color:#111;display:grid;place-items:center;font-weight:950}
.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.hud{position:absolute;z-index:35;right:12px;top:76px;width:295px;display:grid;gap:10px}.panel{border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(16px);padding:12px;box-shadow:0 20px 60px var(--shadow)}
.project{display:flex;align-items:center;justify-content:space-between}.project b{font-size:11px}.project span,.phase{font-size:9px;color:var(--muted)}
.progress{height:7px;border-radius:999px;background:var(--surface);overflow:hidden;margin:9px 0 7px}.progress i{display:block;width:0;height:100%;background:var(--accent);transition:.35s}
.activity{display:grid;gap:8px;max-height:210px;overflow:auto}.event{display:grid;grid-template-columns:9px 1fr;gap:8px}.event i{width:7px;height:7px;margin-top:3px;border-radius:50%;background:#868b93}.event.active i{background:var(--ok)}.event b{font-size:9px;display:block}.event span{font-size:8px;color:var(--muted)}
.final{display:none}.final.show{display:block}.finalText{font-size:10px;line-height:1.5;color:var(--text);white-space:pre-wrap;max-height:190px;overflow:auto}
.controls{position:absolute;z-index:35;left:12px;top:76px;display:grid;gap:8px}.ctrl{border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(16px);padding:8px 10px;color:var(--text);font-size:9px}
.ctrl select{background:transparent;border:0;color:var(--text);outline:none;font-weight:750;max-width:190px}.buttons{display:flex;gap:6px;margin-top:6px}.miniBtn{border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);padding:8px 10px;font-size:9px}.miniBtn.active{border-color:rgba(240,120,24,.75)}
.dock{position:absolute;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(800px,calc(100% - 20px));border:1px solid var(--line);border-radius:22px;background:var(--panel);backdrop-filter:blur(20px);padding:10px;box-shadow:0 20px 60px var(--shadow)}
.taskrow{display:flex;gap:8px}.taskrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:15px;padding:13px 14px;outline:none}.run{border:0;border-radius:15px;background:var(--accent);color:#111;font-weight:950;padding:0 18px}.run:disabled{opacity:.55}
.dockmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:8px;padding:7px 3px 0}
.agent-label{pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap;border:1px solid rgba(128,128,128,.2);border-radius:999px;background:var(--panel-solid);padding:5px 8px;color:var(--text);font-size:9px;font-weight:800;box-shadow:0 8px 24px var(--shadow)}
.agent-label .s{display:inline-block;width:6px;height:6px;border-radius:50%;background:#858b94;margin-left:5px}.agent-label.working .s{background:var(--ok)}
.speech{pointer-events:auto;width:180px;max-height:62px;overflow:hidden;border-radius:14px;background:var(--bubble);color:var(--bubbleText);padding:9px 10px;font-size:10px;line-height:1.35;box-shadow:0 14px 30px rgba(0,0,0,.18);cursor:pointer;display:none}.speech.show{display:block}.speech.expanded{width:260px;max-height:260px}.speech small{display:block;color:#656b74;font-size:8px;margin-top:5px}
.toast{position:absolute;z-index:100;left:50%;top:78px;transform:translate(-50%,-10px);opacity:0;transition:.2s;border:1px solid var(--line);border-radius:12px;background:var(--panel-solid);color:var(--text);padding:9px 12px;font-size:9px}.toast.show{opacity:1;transform:translate(-50%,0)}
.hint{position:absolute;z-index:25;left:50%;bottom:90px;transform:translateX(-50%);color:var(--muted);font-size:8px;pointer-events:none}
@media(max-width:820px){.hud{right:7px;top:auto;bottom:118px;width:225px}.activityPanel{display:none}.controls{left:7px}.top{left:7px;right:7px}.dock{width:calc(100% - 12px)}}
@media(max-width:560px){.hud{width:185px}.controls .ctrl:nth-child(2){display:none}.status span{display:none}.brand span{font-size:13px}}
</style>
</head>
<body>
<div class="app">
<div id="stage"></div>
<header class="top"><div class="brand"><div class="logo">AI</div><span>AI World — Open Studio</span></div><div class="status"><i class="dot" id="liveDot"></i><span id="liveText">CONNECTING…</span></div></header>
<div class="controls">
  <div class="ctrl"><small style="color:var(--muted)">MODEL</small><br><select id="model"></select></div>
  <div class="ctrl"><small style="color:var(--muted)">CAMERA</small><div class="buttons"><button class="miniBtn active" data-cam="overview">Overview</button><button class="miniBtn" data-cam="floor">Floor</button><button class="miniBtn" data-cam="active">Agent</button></div></div>
</div>
<aside class="hud">
  <div class="panel"><div class="project"><div><b>AI Learning Path</b><br><span>Autonomous open studio</span></div><span id="system">Ready</span></div><div class="progress"><i id="progress"></i></div><div class="phase" id="phase">Waiting for a task.</div></div>
  <div class="panel activityPanel"><b style="font-size:11px">Live activity</b><div class="activity" id="activity" style="margin-top:9px"></div></div>
  <div class="panel final" id="finalPanel"><b style="font-size:10px;color:var(--ok)">Final result</b><div class="finalText" id="finalText"></div></div>
</aside>
<div class="hint">Drag to orbit · pinch/scroll to zoom</div>
<div class="dock"><div class="taskrow"><input id="task" placeholder="Tell the team what you want to build…"><button class="run" id="run">RUN</button></div><div class="dockmeta"><span>AI Learning Path · GitHub workflow</span><span>5 autonomous agents</span></div></div>
<div class="toast" id="toast"></div>
</div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.167.1';
import {OrbitControls} from 'https://esm.sh/three@0.167.1/examples/jsm/controls/OrbitControls.js';
import {CSS2DRenderer,CSS2DObject} from 'https://esm.sh/three@0.167.1/examples/jsm/renderers/CSS2DRenderer.js';

const SUPABASE_URL='https://lnvjwqouvhqrbcrmdvfr.supabase.co';
const KEY='sb_publishable_3ZonBrTei5oawbJYC2n7RQ_an8kds07';
const FN=SUPABASE_URL+'/functions/v1/ai-world-claude';
const $=id=>document.getElementById(id);
const runBtn=$('run'),taskInput=$('task'),modelSel=$('model'),phase=$('phase'),progress=$('progress'),activity=$('activity'),finalPanel=$('finalPanel'),finalText=$('finalText'),system=$('system');
let activeRole=null,cameraMode='overview',taskRunning=false;

async function api(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||('Request failed '+r.status));return d}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function addEvent(a,b,on=true){const e=document.createElement('div');e.className='event'+(on?' active':'');e.innerHTML='<i></i><div><b></b><span></span></div>';e.querySelector('b').textContent=a;e.querySelector('span').textContent=b;activity.prepend(e);while(activity.children.length>8)activity.lastChild.remove()}
function setPhase(t,p){phase.textContent=t;progress.style.width=Math.max(0,Math.min(100,p))+'%'}

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,120);camera.position.set(18,15,21);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;$('stage').appendChild(renderer.domElement);
const labels=new CSS2DRenderer();labels.setSize(innerWidth,innerHeight);labels.domElement.style.position='absolute';labels.domElement.style.inset='0';$('stage').appendChild(labels.domElement);
const controls=new OrbitControls(camera,labels.domElement);controls.enableDamping=true;controls.minDistance=7;controls.maxDistance=38;controls.maxPolarAngle=Math.PI/2.03;controls.target.set(0,1.4,0);

const hemi=new THREE.HemisphereLight(0xbdd2ff,0x17100d,1.65);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffd8b5,2.5);sun.position.set(-10,18,9);sun.castShadow=true;scene.add(sun);
const orange=new THREE.PointLight(0xf07818,26,20,2);orange.position.set(-7,4,5);scene.add(orange);
const blue=new THREE.PointLight(0x6e9cff,18,20,2);blue.position.set(8,5,-5);scene.add(blue);

function mesh(geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;return m}
function box(w,h,d,c,x,y,z,r=.65,metal=.05){const m=mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:metal}),x,y,z);scene.add(m);return m}

const platform=box(30,.45,22,0x17181c,0,-.25,0,.78,.05);
let grid=new THREE.GridHelper(30,30,0x34363d,0x202228);grid.position.y=.01;scene.add(grid);

function desk(x,z,rot=0){
  const g=new THREE.Group(),wood=new THREE.MeshStandardMaterial({color:0x38271f,roughness:.6}),dark=new THREE.MeshStandardMaterial({color:0x272a30,roughness:.45,metalness:.45});
  const top=mesh(new THREE.BoxGeometry(3.5,.18,1.65),wood,0,1.05,0);g.add(top);
  for(const sx of[-1.45,1.45])for(const sz of[-.62,.62])g.add(mesh(new THREE.CylinderGeometry(.055,.055,1.02,10),dark,sx,.51,sz));
  const screen=mesh(new THREE.BoxGeometry(1.45,.82,.07),new THREE.MeshStandardMaterial({color:0x091019,emissive:0x153e66,emissiveIntensity:.9}),0,1.65,-.34);g.add(screen);
  const stand=mesh(new THREE.CylinderGeometry(.05,.08,.45,10),dark,0,1.28,-.34);g.add(stand);
  g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);
}
function chair(x,z,rot=0){
  const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:0x292c32,roughness:.55,metalness:.2});
  const seat=mesh(new THREE.BoxGeometry(.85,.12,.8),m,0,.58,0);g.add(seat);
  const back=mesh(new THREE.BoxGeometry(.85,.95,.12),m,0,1.03,.34);g.add(back);
  for(const sx of[-.31,.31])for(const sz of[-.28,.28])g.add(mesh(new THREE.CylinderGeometry(.035,.035,.55,8),m,sx,.28,sz));
  g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);
}

const deskPos={Commander:[0,3.1],Coder:[7.4,-3.3],Researcher:[-7.4,-3.3],Designer:[-6.7,4.4],Reviewer:[6.7,4.4]};
const stations={
  Commander:new THREE.Vector3(0,0,4.55),Coder:new THREE.Vector3(7.4,0,-1.85),
  Researcher:new THREE.Vector3(-7.4,0,-1.85),Designer:new THREE.Vector3(-6.7,0,5.85),Reviewer:new THREE.Vector3(6.7,0,5.85)
};
Object.entries(deskPos).forEach(([role,[x,z]])=>{desk(x,z,Math.PI);chair(stations[role].x,stations[role].z,0)});

const roleColor={Commander:0xf2a258,Coder:0x8ec5ff,Researcher:0x8edfa5,Designer:0xd0a6ff,Reviewer:0xf2d077},agents={};

function makeAgent(role){
  const c=roleColor[role],g=new THREE.Group();
  const white=new THREE.MeshStandardMaterial({color:0xe9edf2,roughness:.3,metalness:.18}),dark=new THREE.MeshStandardMaterial({color:0x22262e,roughness:.32,metalness:.45}),glow=new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.65,roughness:.25});
  const rig=new THREE.Group();g.add(rig);
  const legs=[];
  for(const sx of[-.23,.23]){
    const legPivot=new THREE.Group();legPivot.position.set(sx,.55,0);rig.add(legPivot);
    const leg=mesh(new THREE.CapsuleGeometry(.11,.34,5,10),dark,0,-.17,0);legPivot.add(leg);
    const foot=mesh(new THREE.SphereGeometry(.16,12,10),white,0,-.42,.09);legPivot.add(foot);legs.push(legPivot);
  }
  const body=mesh(new THREE.SphereGeometry(.53,24,18),white,0,.98,0);body.scale.set(1,.92,.72);rig.add(body);
  const core=mesh(new THREE.CylinderGeometry(.15,.15,.04,20),glow,0,1,.39);core.rotation.x=Math.PI/2;rig.add(core);
  const arms=[];
  for(const sx of[-1,1]){
    const shoulder=mesh(new THREE.SphereGeometry(.15,14,10),glow,.55*sx,1.08,0);rig.add(shoulder);
    const armPivot=new THREE.Group();armPivot.position.set(.58*sx,1,0);rig.add(armPivot);
    const arm=mesh(new THREE.CapsuleGeometry(.09,.36,5,9),dark,.1*sx,-.18,.02);arm.rotation.z=-.3*sx;armPivot.add(arm);arms.push(armPivot);
  }
  const head=mesh(new THREE.SphereGeometry(.52,28,20),white,0,1.7,0);head.scale.set(1,1,.84);rig.add(head);
  const face=mesh(new THREE.BoxGeometry(.72,.34,.045),new THREE.MeshStandardMaterial({color:0x10151b,roughness:.25}),0,1.72,.45);rig.add(face);
  for(const sx of[-.19,.19]){const eye=mesh(new THREE.SphereGeometry(.055,12,9),glow,sx,1.75,.49);rig.add(eye)}
  const antenna=mesh(new THREE.CylinderGeometry(.025,.025,.25,8),dark,0,2.18,0);rig.add(antenna);rig.add(mesh(new THREE.SphereGeometry(.07,10,8),glow,0,2.34,0));
  g.position.copy(stations[role]);scene.add(g);

  const label=document.createElement('div');label.className='agent-label';label.innerHTML=role+' <span class="s"></span>';
  const lobj=new CSS2DObject(label);lobj.position.set(0,2.55,0);g.add(lobj);
  const bubble=document.createElement('div');bubble.className='speech';bubble.innerHTML='<span></span><small>Tap to expand</small>';bubble.onclick=e=>{e.stopPropagation();bubble.classList.toggle('expanded')};
  const bobj=new CSS2DObject(bubble);bobj.position.set(0,3.05,0);g.add(bobj);

  agents[role]={group:g,rig,head,body,arms,legs,label,bubble,target:stations[role].clone(),busy:false,state:'sitting',stateUntil:performance.now()+2000+Math.random()*4000,phase:Math.random()*10,home:stations[role].clone()};
  setPose(role,'sitting');
}

function setPose(role,state){
  const a=agents[role];if(!a)return;a.state=state;
  if(state==='sitting'){
    a.rig.position.y=-.23;a.rig.rotation.x=-.03;
    a.legs[0].rotation.x=-1.15;a.legs[1].rotation.x=-1.15;
    a.arms[0].rotation.x=-.45;a.arms[1].rotation.x=-.45;
  }else{
    a.rig.position.y=0;a.rig.rotation.x=0;
    a.legs[0].rotation.x=0;a.legs[1].rotation.x=0;
    a.arms[0].rotation.x=0;a.arms[1].rotation.x=0;
  }
}
Object.keys(stations).forEach(makeAgent);

function moveAgent(role,pos,state='walking'){const a=agents[role];if(!a)return;setPose(role,state);a.target.copy(pos)}
function speak(role,text,ms=4000){const a=agents[role];if(!a)return;a.bubble.querySelector('span').textContent=text;a.bubble.classList.add('show');a.bubble.classList.remove('expanded');clearTimeout(a.hideTimer);a.hideTimer=setTimeout(()=>a.bubble.classList.remove('show'),ms)}
function setAgent(role,busy){const a=agents[role];if(!a)return;a.busy=busy;a.label.classList.toggle('working',busy);if(busy){activeRole=role;if(cameraMode==='active')focusActive()}}
function huddle(role){const spots={Commander:new THREE.Vector3(0,0,.8),Coder:new THREE.Vector3(1.8,0,.2),Researcher:new THREE.Vector3(-1.8,0,.2),Designer:new THREE.Vector3(-1.8,0,2.2),Reviewer:new THREE.Vector3(1.8,0,2.2)};moveAgent(role,spots[role]||stations[role],'walking')}
function sendHome(role){const a=agents[role];if(!a)return;a.target.copy(a.home);setPose(role,'walking');a.state='returning'}
function focusActive(){if(!activeRole)return;const p=agents[activeRole].group.position;camera.position.set(p.x+4,p.y+4.8,p.z+5.6);controls.target.set(p.x,p.y+1.1,p.z)}

document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>{cameraMode=b.dataset.cam;document.querySelectorAll('[data-cam]').forEach(x=>x.classList.toggle('active',x===b));if(cameraMode==='overview'){camera.position.set(18,15,21);controls.target.set(0,1.4,0)}else if(cameraMode==='floor'){camera.position.set(11,6,15);controls.target.set(0,1.3,1)}else focusActive()});

async function callAgent(role,prompt,context=''){
  setAgent(role,true);huddle(role);speak(role,role==='Reviewer'?'I’m checking the team’s work…':'I’m working on my part now…',3500);addEvent(role+' started',prompt.slice(0,70));
  try{const d=await api({action:'run',role,model:modelSel.value,prompt,context,max_tokens:1800});speak(role,(d.text||'Done.').slice(0,220),6500);addEvent(role+' finished',(d.text||'Done').slice(0,90),false);return{role,text:d.text||'',model:d.model||modelSel.value}}
  finally{setAgent(role,false);setTimeout(()=>sendHome(role),900)}
}
async function runTeam(prompt){
  if(taskRunning)return;taskRunning=true;runBtn.disabled=true;finalPanel.classList.remove('show');setPhase('Commander is planning the job…',10);system.textContent='Planning';setAgent('Commander',true);huddle('Commander');speak('Commander','I’m breaking this into the right jobs…',3500);
  try{
    const pd=await api({action:'plan',role:'Commander',model:modelSel.value,prompt,max_tokens:1200});setAgent('Commander',false);
    const plan=pd.parsed||{};let tasks=Array.isArray(plan.tasks)?plan.tasks.filter(t=>['Coder','Researcher','Designer'].includes(t.role)).slice(0,3):[];
    if(!tasks.length)tasks=[{role:'Researcher',prompt},{role:'Coder',prompt}];
    speak('Commander',plan.summary||'Plan ready. Sending work to the team.',5000);setPhase('Specialists are working…',35);system.textContent='Working';
    const results=await Promise.allSettled(tasks.map(t=>callAgent(t.role,t.prompt||prompt,'Original goal: '+prompt)));
    const out=[];results.forEach((r,i)=>out.push(r.status==='fulfilled'?r.value:{role:tasks[i].role,text:'Error: '+r.reason.message,model:modelSel.value}));
    setPhase('Reviewer is checking everything…',78);system.textContent='Reviewing';
    const material=out.map(x=>'['+x.role+']\n'+x.text).join('\n\n');
    const review=await callAgent('Reviewer','Give a concise final result for the user. Start with the outcome, then the important changes, then any next action.\n\nGoal:\n'+prompt+'\n\nTeam work:\n'+material);
    setPhase('Task complete.',100);system.textContent='Done';finalText.textContent=review.text||'Completed.';finalPanel.classList.add('show');speak('Commander','Finished. The final result is ready on the right.',5000);addEvent('Task complete','Reviewer produced the final summary.',false);Object.keys(agents).forEach(sendHome)
  }catch(e){system.textContent='Error';setPhase('Something failed: '+e.message,0);toast(e.message);Object.keys(agents).forEach(r=>{setAgent(r,false);sendHome(r)})}
  finally{taskRunning=false;runBtn.disabled=false}
}

runBtn.onclick=()=>{const p=taskInput.value.trim();if(!p)return toast('Write a task first');runTeam(p)};
taskInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runBtn.click()}});
modelSel.onchange=()=>localStorage.setItem('aiworld_model',modelSel.value);

async function startup(){
  const fallback=[{id:'claude-sonnet-5',name:'Claude Sonnet 5'},{id:'claude-opus-5',name:'Claude Opus 5'},{id:'claude-fable-5',name:'Claude Fable 5'}];
  const fill=ms=>{modelSel.innerHTML='';ms.forEach(m=>modelSel.add(new Option(m.name,m.id)));modelSel.value=localStorage.getItem('aiworld_model')||modelSel.options[0]?.value||'claude-sonnet-5'};
  fill(fallback);
  try{const m=await api({action:'models'});if(Array.isArray(m.models))fill(m.models);const h=await api({action:'health'});$('liveText').textContent=h.githubConfigured?'CLAUDE + GITHUB CONNECTED':'CLAUDE CONNECTED';$('liveDot').style.background=h.claudeConfigured?'var(--ok)':'var(--bad)';addEvent('Backend connected',h.githubConfigured?'Claude and GitHub are ready.':'Claude ready; GitHub token not detected.',false)}
  catch(e){$('liveText').textContent='BACKEND OFFLINE';$('liveDot').style.background='var(--bad)';addEvent('Connection error',e.message,false)}
}

const themeMedia=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const dark=themeMedia.matches;
  const bg=dark?0x090a0d:0xf4f4f1,fog=dark?0x090a0d:0xf4f4f1;
  scene.background=new THREE.Color(bg);scene.fog=new THREE.FogExp2(fog,dark?.018:.012);
  platform.material.color.setHex(dark?0x17181c:0xe4e4df);
  hemi.color.setHex(dark?0xbdd2ff:0xffffff);hemi.groundColor.setHex(dark?0x17100d:0xb9b4aa);hemi.intensity=dark?1.65:2.1;
  sun.intensity=dark?2.5:2.1;orange.intensity=dark?26:10;blue.intensity=dark?18:7;
  scene.remove(grid);grid=new THREE.GridHelper(30,30,dark?0x34363d:0xb9b9b3,dark?0x202228:0xd5d5cf);grid.position.y=.01;scene.add(grid);
  $('themeColor').setAttribute('content',dark?'#090a0d':'#f4f4f1');
}
themeMedia.addEventListener?.('change',applyTheme);applyTheme();

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),now=performance.now(),t=now/1000;
  for(const [role,a] of Object.entries(agents)){
    const dist=a.group.position.distanceTo(a.target);
    a.group.position.lerp(a.target,1-Math.pow(.0012,dt));
    if(dist>.12){
      setPose(role,'walking');
      const dx=a.target.x-a.group.position.x,dz=a.target.z-a.group.position.z;
      if(Math.abs(dx)+Math.abs(dz)>.02)a.group.rotation.y=Math.atan2(dx,dz);
      const step=Math.sin(t*8+a.phase)*.22;
      a.legs[0].rotation.x=step;a.legs[1].rotation.x=-step;a.arms[0].rotation.x=-step*.7;a.arms[1].rotation.x=step*.7;
      a.rig.position.y=Math.abs(Math.sin(t*8+a.phase))*.035;
    }else{
      if(a.state==='returning'&&!a.busy){setPose(role,'sitting');a.group.rotation.y=Math.PI;a.stateUntil=now+2500+Math.random()*5000}
      if(a.busy){
        setPose(role,'standing');
        a.head.rotation.y=Math.sin(t*2+a.phase)*.14;a.body.rotation.z=Math.sin(t*2.6+a.phase)*.025;
      }else if(a.state==='sitting'){
        a.head.rotation.y=Math.sin(t*.8+a.phase)*.16;
        a.rig.position.y=-.23+Math.sin(t*1.5+a.phase)*.012;
        a.arms[0].rotation.x=-.45+Math.sin(t*3+a.phase)*.08;a.arms[1].rotation.x=-.45-Math.sin(t*3+a.phase)*.08;
        if(now>a.stateUntil&&Math.random()<.012){
          const p=a.home.clone().add(new THREE.Vector3((Math.random()-.5)*2.3,0,1.0+Math.random()*1.4));
          a.target.copy(p);a.state='wandering';a.stateUntil=now+1800+Math.random()*2200;
        }
      }else if(a.state==='wandering'&&now>a.stateUntil){
        a.target.copy(a.home);a.state='returning';
      }else{
        a.rig.position.y=Math.sin(t*2+a.phase)*.018;a.head.rotation.y=Math.sin(t*.9+a.phase)*.12;
      }
    }
  }
  controls.update();renderer.render(scene,camera);labels.render(scene,camera)
}
animate();startup();addEvent('Studio loaded','Agents now sit, get up, wander and work instead of freezing inside desks.',false);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);labels.setSize(innerWidth,innerHeight)});
</script>
