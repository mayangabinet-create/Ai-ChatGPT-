<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0c0e">
<title>AI World</title>
<style>
:root{--bg:#0c0c0e;--panel:#141519;--panel2:#1a1c22;--line:#2b2e36;--text:#f2f1ef;--muted:#9499a3;--accent:#f07818;--ok:#67d28f;--bad:#ef7777}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;min-height:100%;overscroll-behavior:none}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:50;height:68px;padding:env(safe-area-inset-top) 14px 0;display:flex;align-items:center;justify-content:space-between;background:rgba(12,12,14,.93);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.logo{width:34px;height:34px;border-radius:11px;background:var(--accent);color:#111;display:grid;place-items:center;font-weight:950}.status{font-size:10px;color:var(--muted);display:flex;gap:7px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}.wrap{max-width:1000px;margin:auto;padding:12px 12px 150px}.controls{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:10px}.control{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:10px 12px}.control small{display:block;color:var(--muted);font-size:8px;letter-spacing:.09em;margin-bottom:5px}.control select{width:100%;background:transparent;border:0;color:var(--text);outline:0;font-weight:700}.toggle{min-width:130px;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:10px}.switch{width:42px;height:24px;border-radius:999px;background:var(--accent);position:relative}.switch:after{content:"";position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:21px;transition:.18s}.switch.off{background:#333740}.switch.off:after{left:3px}.world{position:relative;height:690px;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:radial-gradient(circle at 50% 40%,#161920 0,#101216 64%,#0d0f13 100%)}.world:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px}.tag{position:absolute;z-index:3;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:rgba(20,21,25,.94);font-size:10px;color:var(--muted)}.tag b{display:block;color:var(--text);font-size:11px;margin-bottom:2px}.hq{left:50%;top:88px;transform:translateX(-50%)}.code{left:5%;top:270px}.research{right:5%;top:270px}.design{left:8%;bottom:75px}.review{right:8%;bottom:75px}.agent{position:absolute;z-index:10;width:72px;text-align:center;transform:translate(-50%,-50%);touch-action:none;user-select:none}.avatar{width:46px;height:46px;margin:auto;border-radius:14px;border:3px solid #2a2d34;background:#eee;color:#111;display:grid;place-items:center;font-weight:900;box-shadow:0 10px 22px rgba(0,0,0,.35)}.agent[data-role="Commander"] .avatar{background:#f3a75e}.agent[data-role="Coder"] .avatar{background:#a9ccff}.agent[data-role="Researcher"] .avatar{background:#c7f0d4}.agent[data-role="Designer"] .avatar{background:#dcc4f2}.agent[data-role="Reviewer"] .avatar{background:#ffe099}.name{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:4px 7px;border-radius:999px;background:#0d0f13;border:1px solid #2b2e36;font-size:8px;white-space:nowrap}.stateDot{width:5px;height:5px;border-radius:50%;background:#68707c}.working .stateDot{background:var(--ok);box-shadow:0 0 8px rgba(103,210,143,.7)}.error .stateDot{background:var(--bad)}.activity{position:absolute;left:12px;right:12px;bottom:12px;z-index:8;text-align:center}.activity span{display:inline-block;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(15,17,21,.92);font-size:9px;color:var(--muted)}.dock{position:fixed;z-index:80;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:1000px;margin:auto;background:rgba(20,21,25,.97);border:1px solid var(--line);border-radius:22px;padding:11px;backdrop-filter:blur(18px)}.row{display:flex;gap:8px}.row input{flex:1;min-width:0;background:#0f1115;border:1px solid var(--line);color:var(--text);border-radius:14px;padding:13px;outline:0}.run{border:0;border-radius:14px;background:var(--accent);color:#121212;font-weight:950;padding:0 18px;min-width:72px}.run:disabled{opacity:.55}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;padding:8px 4px 0}.results{position:fixed;left:0;right:0;bottom:0;z-index:120;max-height:80svh;overflow:auto;background:#121317;border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:12px 14px calc(22px + env(safe-area-inset-bottom));transform:translateY(110%);transition:.24s}.results.open{transform:translateY(0)}.resultTop{display:flex;align-items:center;justify-content:space-between}.close{width:36px;height:36px;border-radius:11px;background:#1c1e24;border:1px solid var(--line);color:var(--text)}.card{background:#191b20;border:1px solid var(--line);border-radius:15px;padding:12px;margin-top:10px}.card h3{font-size:12px;margin:0 0 4px}.card small{color:var(--muted)}.card pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:11px;line-height:1.55;margin:8px 0 0;color:#d9dce2}.toast{position:fixed;top:78px;left:50%;z-index:150;transform:translate(-50%,-15px);opacity:0;transition:.2s;background:#1a1c21;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:10px;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:560px){.wrap{padding:9px 7px 145px}.world{height:710px;border-radius:20px}.controls{grid-template-columns:minmax(0,1fr) 126px}.tag{padding:9px 10px}.code{left:3%}.research{right:3%}.design{left:3%}.review{right:3%}.dock{left:6px;right:6px}.liveText{display:none}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">AI</div><span>AI World</span></div><div class="status"><i class="dot" id="liveDot"></i><span class="liveText" id="liveText">CONNECTING…</span></div></header>
<main class="wrap">
<div class="controls"><div class="control"><small>DEFAULT MODEL</small><select id="model"></select></div><button class="control toggle" id="autoBtn"><span><small>AUTO TEAM</small><b style="font-size:11px">Commander routes</b></span><i class="switch" id="switch"></i></button></div>
<section class="world" id="world">
<div class="tag hq"><b>COMMAND HQ</b>Plan & coordinate</div><div class="tag code"><b>CODE DISTRICT</b>Build & debug</div><div class="tag research"><b>RESEARCH LAB</b>Find & compare</div><div class="tag design"><b>DESIGN STUDIO</b>UX & product</div><div class="tag review"><b>REVIEW STATION</b>Inspect & approve</div>
<div class="agent" data-role="Commander" style="left:50%;top:30%"><div class="avatar">C</div><div class="name">Commander <i class="stateDot"></i></div></div>
<div class="agent" data-role="Coder" style="left:20%;top:57%"><div class="avatar">&lt;/&gt;</div><div class="name">Coder <i class="stateDot"></i></div></div>
<div class="agent" data-role="Researcher" style="left:80%;top:57%"><div class="avatar">R</div><div class="name">Researcher <i class="stateDot"></i></div></div>
<div class="agent" data-role="Designer" style="left:27%;top:75%"><div class="avatar">D</div><div class="name">Designer <i class="stateDot"></i></div></div>
<div class="agent" data-role="Reviewer" style="left:73%;top:75%"><div class="avatar">✓</div><div class="name">Reviewer <i class="stateDot"></i></div></div>
<div class="activity"><span id="activity">World ready.</span></div>
</section>
</main>
<div class="dock"><div class="row"><input id="task" placeholder="What should your AI team do?"><button class="run" id="run">RUN</button></div><div class="meta"><span>AI Learning Path connected</span><span id="system">Ready</span></div></div>
<div class="results" id="results"><div class="resultTop"><b>Team result</b><button class="close" id="close">×</button></div><div id="cards"></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const SUPABASE_URL='https://lnvjwqouvhqrbcrmdvfr.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxudmp3cW91dmhxcmJjcm1kdmZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzgxODAsImV4cCI6MjEwNDU1NDE4MH0.EFuU_L7F0KX2ePyDhjD3gnoUYvJeAPAkSHLTdgLYoTc';
const FN=SUPABASE_URL+'/functions/v1/ai-world-claude';
const $=id=>document.getElementById(id);
const runBtn=$('run'),task=$('task'),model=$('model'),system=$('system'),activity=$('activity'),results=$('results'),cards=$('cards'),toastEl=$('toast'),world=$('world');
const agents=[...document.querySelectorAll('.agent')];
const byRole=Object.fromEntries(agents.map(a=>[a.dataset.role,a]));
let auto=true,drag=null;
const fallback=[['claude-sonnet-5','Claude Sonnet 5'],['claude-opus-5','Claude Opus 5'],['claude-fable-5','Claude Fable 5'],['claude-opus-4-8','Claude Opus 4.8'],['claude-sonnet-4-6','Claude Sonnet 4.6'],['claude-haiku-4-5-20251001','Claude Haiku 4.5']];
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2200)}
async function api(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||('Request failed '+r.status));return d}
function fillModels(list){model.innerHTML='';(list||fallback.map(x=>({id:x[0],name:x[1]}))).forEach(m=>model.add(new Option(m.name,m.id)));model.value=localStorage.getItem('aiworld_model')||model.options[0]?.value||'claude-sonnet-5'}
function setStatus(role,s){const a=byRole[role];if(!a)return;a.classList.toggle('working',s==='Working');a.classList.toggle('error',s==='Error')}
function addCard(r){const c=document.createElement('div');c.className='card';const h=document.createElement('h3');h.textContent=r.role;const sm=document.createElement('small');sm.textContent=r.model||'';const p=document.createElement('pre');p.textContent=r.text||'';c.append(h,sm,p);cards.append(c)}
function show(list){cards.innerHTML='';list.forEach(addCard);results.classList.add('open')}
async function callAgent(role,prompt,context=''){setStatus(role,'Working');activity.textContent=role+' is working…';try{const d=await api({action:'run',role,model:model.value,prompt,context,max_tokens:1800});setStatus(role,'Idle');return{role,text:d.text||'',model:d.model||model.value}}catch(e){setStatus(role,'Error');throw e}}
async function runTeam(prompt){runBtn.disabled=true;system.textContent='Planning';activity.textContent='Commander is planning…';try{if(!auto){show([await callAgent('Commander',prompt)]);system.textContent='Done';return}setStatus('Commander','Working');const pd=await api({action:'plan',role:'Commander',model:model.value,prompt,max_tokens:1200});setStatus('Commander','Idle');const plan=pd.parsed||{};let tasks=Array.isArray(plan.tasks)?plan.tasks.filter(t=>['Coder','Researcher','Designer'].includes(t.role)).slice(0,3):[];const out=[{role:'Commander',text:plan.summary||pd.text||'Plan created.',model:pd.model||model.value}];if(!tasks.length)tasks=[{role:'Researcher',prompt},{role:'Coder',prompt}];system.textContent='Working';const rs=await Promise.allSettled(tasks.map(t=>callAgent(t.role,t.prompt||prompt,'Original goal: '+prompt)));rs.forEach((r,i)=>out.push(r.status==='fulfilled'?r.value:{role:tasks[i].role,text:'Error: '+r.reason.message,model:model.value}));system.textContent='Reviewing';const material=out.slice(1).map(x=>'['+x.role+']\n'+x.text).join('\n\n');out.push(await callAgent('Reviewer','Review the team work and give the final recommendation.\n\nGoal:\n'+prompt+'\n\nWork:\n'+material));show(out);system.textContent='Done';activity.textContent='Team finished.'}catch(e){console.error(e);system.textContent='Error';activity.textContent='Failed: '+e.message;toast(e.message);agents.forEach(a=>setStatus(a.dataset.role,'Idle'))}finally{runBtn.disabled=false}}
async function startup(){fillModels();try{const m=await api({action:'models'});if(Array.isArray(m.models))fillModels(m.models);const h=await api({action:'health'});$('liveText').textContent=h.githubConfigured?'CLAUDE + GITHUB CONNECTED':'CLAUDE CONNECTED';$('liveDot').style.background=h.claudeConfigured?'var(--ok)':'var(--bad)';if(h.githubConfigured)activity.textContent='AI Learning Path GitHub connection ready.'}catch(e){$('liveText').textContent='BACKEND OFFLINE';$('liveDot').style.background='var(--bad)';activity.textContent='Backend check failed: '+e.message}}
runBtn.addEventListener('click',()=>{const p=task.value.trim();if(!p){toast('Write a task first');task.focus();return}runTeam(p)});
task.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runBtn.click()}});
model.addEventListener('change',()=>localStorage.setItem('aiworld_model',model.value));
$('autoBtn').addEventListener('click',()=>{auto=!auto;$('switch').classList.toggle('off',!auto);toast(auto?'Auto Team on':'Commander only')});
$('close').addEventListener('click',()=>results.classList.remove('open'));
function begin(a,x,y){const ar=a.getBoundingClientRect();drag={a,dx:x-(ar.left+ar.width/2),dy:y-(ar.top+ar.height/2)}}
function move(x,y){if(!drag)return;const r=world.getBoundingClientRect();let px=(x-r.left-drag.dx)/r.width,py=(y-r.top-drag.dy)/r.height;px=Math.max(.06,Math.min(.94,px));py=Math.max(.1,Math.min(.9,py));drag.a.style.left=(px*100)+'%';drag.a.style.top=(py*100)+'%'}
function end(){drag=null}
agents.forEach(a=>{a.addEventListener('pointerdown',e=>{e.preventDefault();begin(a,e.clientX,e.clientY);a.setPointerCapture?.(e.pointerId)});a.addEventListener('pointermove',e=>{if(drag?.a===a){e.preventDefault();move(e.clientX,e.clientY)}});a.addEventListener('pointerup',end);a.addEventListener('pointercancel',end)});
startup();
})();
</script>
</body>
</html>
