const scene=new THREE.Scene();scene.background=new THREE.Color(0x090a0d);scene.fog=new THREE.Fog(0x090a0d,22,58);const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);camera.position.set(17,14,20);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;$('stage').appendChild(renderer.domElement);const labels=new CSS2DRenderer();labels.setSize(innerWidth,innerHeight);labels.domElement.style.position='absolute';labels.domElement.style.inset='0';labels.domElement.style.pointerEvents='auto';$('stage').appendChild(labels.domElement);const controls=new OrbitControls(camera,labels.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=7;controls.maxDistance=34;controls.maxPolarAngle=Math.PI/2.08;controls.target.set(0,2,0);scene.add(new THREE.HemisphereLight(0xa9c7ff,0x28190f,1.15));const key=new THREE.DirectionalLight(0xffd1a3,2.1);key.position.set(-8,16,8);key.castShadow=true;scene.add(key);const fill=new THREE.PointLight(0x4d7fff,30,24,2);fill.position.set(8,7,-7);scene.add(fill);const warm=new THREE.PointLight(0xff7b28,35,18,2);warm.position.set(-9,4,2);scene.add(warm);
function box(w,h,d,color,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.65,metalness:.08}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}box(28,.35,20,0x16171b,0,-.2,0);box(28,.25,20,0x101116,0,8,0);box(.25,8,20,0x17191d,-14,4,0);box(.25,8,20,0x17191d,14,4,0);box(28,8,.25,0x111722,0,4,-10);for(let x=-12;x<=12;x+=4)box(.08,8,.08,0x30343b,x,4,-9.78);for(let y=1;y<=7;y+=3)box(28,.08,.08,0x30343b,0,y,-9.78);for(let i=0;i<34;i++){const h=1+Math.random()*5;box(.45+Math.random()*.7,h,.6,0x0a0e16,-13+Math.random()*26,h/2-1,-11-Math.random()*4)}
function desk(x,z,rot=0){const g=new THREE.Group();const top=new THREE.Mesh(new THREE.BoxGeometry(4,.22,2),new THREE.MeshStandardMaterial({color:0x3a2a21,roughness:.55}));top.position.y=1.25;top.castShadow=true;g.add(top);for(const sx of[-1.65,1.65])for(const sz of[-.72,.72]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.12,1.25,.12),new THREE.MeshStandardMaterial({color:0x24262b,metalness:.5}));leg.position.set(sx,.62,sz);g.add(leg)}const screen=new THREE.Mesh(new THREE.BoxGeometry(1.65,.95,.08),new THREE.MeshStandardMaterial({color:0x0a1018,emissive:0x12304f,emissiveIntensity:.7}));screen.position.set(0,1.95,-.42);g.add(screen);g.position.set(x,0,z);g.rotation.y=rot;scene.add(g)}const stations={Commander:new THREE.Vector3(0,0,2.5),Coder:new THREE.Vector3(7,0,-1.8),Researcher:new THREE.Vector3(-6.8,0,-1.7),Designer:new THREE.Vector3(-6.2,0,5.2),Reviewer:new THREE.Vector3(6.3,0,5.2)};desk(0,2.5,Math.PI);desk(7,-1.8,Math.PI);desk(-6.8,-1.7,Math.PI);desk(-6.2,5.2,0);desk(6.3,5.2,0);box(.08,2.2,8,0x24262c,-3.5,1.2,1.3);box(.08,2.2,8,0x24262c,3.5,1.2,1.3);
const roleColor={Commander:0xf2a258,Coder:0x8ec5ff,Researcher:0x8edfa5,Designer:0xd0a6ff,Reviewer:0xf2d077},agents={};function makeAgent(role){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.5,.8,6,12),new THREE.MeshStandardMaterial({color:0xd8dce2,roughness:.28,metalness:.35}));body.position.y=1.15;body.castShadow=true;g.add(body);const face=new THREE.Mesh(new THREE.BoxGeometry(.72,.42,.08),new THREE.MeshStandardMaterial({color:0x071018,emissive:roleColor[role],emissiveIntensity:.75}));face.position.set(0,1.45,.49);g.add(face);const base=new THREE.Mesh(new THREE.CylinderGeometry(.42,.48,.18,18),new THREE.MeshStandardMaterial({color:0x2b2f36,metalness:.5}));base.position.y=.45;g.add(base);g.position.copy(stations[role]);scene.add(g);const label=document.createElement('div');label.className='agent-label';label.innerHTML=role+' <span class="s"></span>';const lobj=new CSS2DObject(label);lobj.position.set(0,2.25,0);g.add(lobj);const bubble=document.createElement('div');bubble.className='speech';bubble.innerHTML='<span></span><small>Tap to expand</small>';bubble.onclick=e=>{e.stopPropagation();bubble.classList.toggle('expanded')};const bobj=new CSS2DObject(bubble);bobj.position.set(0,2.9,0);g.add(bobj);agents[role]={group:g,label,bubble,target:stations[role].clone(),busy:false}}Object.keys(stations).forEach(makeAgent);function moveAgent(role,pos){agents[role]?.target.copy(pos)}function speak(role,text,ms=4000){const a=agents[role];if(!a)return;a.bubble.querySelector('span').textContent=text;a.bubble.classList.add('show');a.bubble.classList.remove('expanded');clearTimeout(a.hideTimer);a.hideTimer=setTimeout(()=>a.bubble.classList.remove('show'),ms)}function setAgent(role,busy){const a=agents[role];if(!a)return;a.busy=busy;a.label.classList.toggle('working',busy);if(busy){activeRole=role;if(cameraMode==='active')focusActive()}}function huddle(role){const spots={Commander:new THREE.Vector3(0,0,1.1),Coder:new THREE.Vector3(1.7,0,.5),Researcher:new THREE.Vector3(-1.7,0,.5),Designer:new THREE.Vector3(-1.8,0,2.2),Reviewer:new THREE.Vector3(1.8,0,2.2)};moveAgent(role,spots[role]||stations[role])}function sendHome(role){moveAgent(role,stations[role])}function focusActive(){if(!activeRole)return;const p=agents[activeRole].group.position;camera.position.set(p.x+4,p.y+4.8,p.z+5.6);controls.target.set(p.x,p.y+1.1,p.z)}document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>{cameraMode=b.dataset.cam;document.querySelectorAll('[data-cam]').forEach(x=>x.classList.toggle('active',x===b));if(cameraMode==='overview'){camera.position.set(17,14,20);controls.target.set(0,2,0)}else if(cameraMode==='floor'){camera.position.set(11,6,15);controls.target.set(0,1.5,1)}else focusActive()});
async function callAgent(role,prompt,context=''){setAgent(role,true);huddle(role);speak(role,role==='Reviewer'?'I’m checking the team’s work…':'I’m working on my part now…',3500);addEvent(role+' started',prompt.slice(0,70));try{const d=await api({action:'run',role,model:modelSel.value,prompt,context,max_tokens:1800});speak(role,(d.text||'Done.').slice(0,220),6500);addEvent(role+' finished',(d.text||'Done').slice(0,90),false);return{role,text:d.text||'',model:d.model||modelSel.value}}finally{setAgent(role,false);setTimeout(()=>sendHome(role),1200)}}async function runTeam(prompt){if(taskRunning)return;taskRunning=true;runBtn.disabled=true;finalPanel.classList.remove('show');setPhase('Commander is planning the job…',10);system.textContent='Planning';setAgent('Commander',true);huddle('Commander');speak('Commander','I’m breaking this into the right jobs…',3500);try{const pd=await api({action:'plan',role:'Commander',model:modelSel.value,prompt,max_tokens:1200});setAgent('Commander',false);const plan=pd.parsed||{};let tasks=Array.isArray(plan.tasks)?plan.tasks.filter(t=>['Coder','Researcher','Designer'].includes(t.role)).slice(0,3):[];if(!tasks.length)tasks=[{role:'Researcher',prompt},{role:'Coder',prompt}];speak('Commander',plan.summary||'Plan ready. Sending work to the team.',5000);setPhase('Specialists are working…',35);system.textContent='Working';const results=await Promise.allSettled(tasks.map(t=>callAgent(t.role,t.prompt||prompt,'Original goal: '+prompt)));const out=[];results.forEach((r,i)=>out.push(r.status==='fulfilled'?r.value:{role:tasks[i].role,text:'Error: '+r.reason.message,model:modelSel.value}));setPhase('Reviewer is checking everything…',78);system.textContent='Reviewing';const material=out.map(x=>'['+x.role+']\n'+x.text).join('\n\n');const review=await callAgent('Reviewer','Give a concise final result for the user. Start with the outcome, then the important changes, then any next action.\n\nGoal:\n'+prompt+'\n\nTeam work:\n'+material);setPhase('Task complete.',100);system.textContent='Done';finalText.textContent=review.text||'Completed.';finalPanel.classList.add('show');speak('Commander','Finished. The final result is ready on the right.',5000);addEvent('Task complete','Reviewer produced the final summary.',false);Object.keys(agents).forEach(sendHome)}catch(e){system.textContent='Error';setPhase('Something failed: '+e.message,0);toast(e.message);Object.keys(agents).forEach(r=>{setAgent(r,false);sendHome(r)})}finally{taskRunning=false;runBtn.disabled=false}}runBtn.onclick=()=>{const p=taskInput.value.trim();if(!p)return toast('Write a task first');runTeam(p)};taskInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runBtn.click()}});modelSel.onchange=()=>localStorage.setItem('aiworld_model',modelSel.value);async function startup(){const fallback=[{id:'claude-sonnet-5',name:'Claude Sonnet 5'},{id:'claude-opus-5',name:'Claude Opus 5'},{id:'claude-fable-5',name:'Claude Fable 5'}];const fill=ms=>{modelSel.innerHTML='';ms.forEach(m=>modelSel.add(new Option(m.name,m.id)));modelSel.value=localStorage.getItem('aiworld_model')||modelSel.options[0]?.value||'claude-sonnet-5'};fill(fallback);try{const m=await api({action:'models'});if(Array.isArray(m.models))fill(m.models);const h=await api({action:'health'});$('liveText').textContent=h.githubConfigured?'CLAUDE + GITHUB CONNECTED':'CLAUDE CONNECTED';$('liveDot').style.background=h.claudeConfigured?'var(--ok)':'var(--bad)';addEvent('Backend connected',h.githubConfigured?'Claude and GitHub are ready.':'Claude ready; GitHub token not detected.',false)}catch(e){$('liveText').textContent='BACKEND OFFLINE';$('liveDot').style.background='var(--bad)';addEvent('Connection error',e.message,false)}}const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);for(const a of Object.values(agents)){a.group.position.lerp(a.target,1-Math.pow(.0008,dt));if(a.busy)a.group.rotation.y+=dt*.45}controls.update();render
